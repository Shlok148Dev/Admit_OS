version: '3.8'

services:
  # Database Layer
  postgres:
    image: postgres:16-alpine
    container_name: admitos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: admitos_db
      POSTGRES_USER: admitos_admin
      POSTGRES_PASSWORD: admitos_secure_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admitos_admin -d admitos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: admitos-pgbouncer
    ports:
      - "6432:6432"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admitos_admin
      - DB_PASSWORD=admitos_secure_password_123
      - DB_NAME=admitos_db
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - AUTH_TYPE=scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U admitos_admin -d admitos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache Layer
  redis:
    image: redis:7-alpine
    container_name: admitos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Event Broker (ZooKeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: admitos-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: admitos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Confluent Schema Registry (for Avro Serialization)
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: admitos-schema-registry
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloud Mock Service
  localstack:
    image: localstack/localstack:3.4
    container_name: admitos-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,secretsmanager,ssm
      - DEFAULT_REGION=asia-south1
    volumes:
      - localstack_data:/var/lib/localstack

  # Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: admitos-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/admitos_dev
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: admitos-auth-service
    ports:
      - "8001:8000"
    environment:
      - ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=local_dev_secret_key_change_in_prod_12345
      - GOOGLE_CLIENT_ID=mock-google-id
      - GOOGLE_CLIENT_SECRET=mock-google-secret
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    container_name: admitos-user-service
    ports:
      - "8002:8000"
    environment:
      - ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  prediction-service:
    build:
      context: ./services/prediction
      dockerfile: Dockerfile
    container_name: admitos-prediction-service
    ports:
      - "8003:8000"
    environment:
      - ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  career-service:
    build:
      context: ./services/career
      dockerfile: Dockerfile
    container_name: admitos-career-service
    ports:
      - "8004:8000"
    environment:
      - ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=admitos_dev
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: admitos-notification-service
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  counseling-service:
    build:
      context: ./services/counseling
      dockerfile: Dockerfile
    container_name: admitos-counseling-service
    ports:
      - "8006:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: admitos-analytics-service
    ports:
      - "8007:8000"
    environment:
      - DATABASE_URL=postgresql://admitos_admin:admitos_secure_password_123@pgbouncer:6432/admitos_db?prepared_statement_cache_size=0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  neo4j_data:

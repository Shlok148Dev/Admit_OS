# Note: For production GKE deployment, GCP Secret Manager CSI Driver injects these at runtime.
apiVersion: v1
kind: Secret
metadata:
  name: admitos-secrets
  labels:
    app.kubernetes.io/name: admitos
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:REPLACE_WITH_SECRET@postgres-service:5432/admitos_db"
  JWT_SECRET: "REPLACE_WITH_CRYPTOGRAPHICALLY_RANDOM_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_CRYPTOGRAPHICALLY_RANDOM_REFRESH_SECRET"
  ADMIN_PASSWORD: "REPLACE_WITH_SECURE_ADMIN_PASSWORD"

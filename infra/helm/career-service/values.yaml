replicaCount: 2

image:
  repository: gcr.io/admit-os/career-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8004

env:
  ENVIRONMENT: production
  REDIS_URL: "redis://redis-master.default.svc.cluster.local:6379/0"
  NEO4J_URI: "bolt://neo4j.default.svc.cluster.local:7687"

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

replicaCount: 5

image:
  repository: asia-south1-docker.pkg.dev/your-project/admitos/counseling-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

env:
  - name: ENV
    value: "production"
  - name: PORT
    value: "8000"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "counseling-service-sa@your-project.iam.gserviceaccount.com"
  name: "counseling-service-sa"

nodeSelector: {}
tolerations: []
affinity: {}
